schema_version: 1
generation: gx10-qualification-v4
default_profile: standard

# The public leaderboard compares each model's curated configured deployment.
# Explicit policy selections remain strict controlled-policy cohorts.
public_benchmark_track: primary-deployment
public_reasoning_policy_rule: configured-per-model

# One methodology-defined total completion allowance for every direct endpoint
# response/tool probe, independent of model and reasoning policy.
direct_probe:
  contract: gx10-direct-probe-v1
  max_tokens: 1024

thresholds:
  aggregate: 70.0
  coding: 60.0
  hermes: 100.0
  tool_instruction: 70.0
  reliability: 80.0

weights:
  coding: 40
  hermes: 30
  tool_instruction: 15
  reliability: 10
  performance: 5

profiles:
  smoke:
    expected_duration: 10-20 minutes
    total_wall_seconds: 1800
    inactivity_seconds: 600
    spark: null
    benchlocal:
      - id: targeted
        scenarios: [toolcall-15/TC-01, instructfollow-15/IF-01]
        repeat: 1
        timeout_per_case: 180
    infermark:
      contexts: {short: 128}
      requests: 1
      concurrency: [1]
      max_tokens: 64
      warmup: 0
      timeout: 180
    hermes_tasks: [harness-smoke-v1]

  standard:
    expected_duration: 3-5 hours on the baseline GX10 deployment
    total_wall_seconds: 18000
    inactivity_seconds: 900
    spark:
      tier: challenge
      repeats: 3
      timeout: 900
      skip_throughput: true
    benchlocal:
      - id: behavioral
        mode: quick
        repeat: 3
        timeout_per_case: 300
    infermark:
      contexts: {short: 256, medium: 4096}
      requests: 3
      concurrency: [1]
      max_tokens: 128
      warmup: 1
      timeout: 300
    hermes_tasks: [harness-smoke-v1, convergence-smoke-v1]

  overnight:
    expected_duration: 8-12 hours on the baseline GX10 deployment
    total_wall_seconds: 43200
    inactivity_seconds: 1200
    spark:
      tier: all
      repeats: 3
      timeout: 1200
      skip_throughput: true
    benchlocal:
      - id: behavioral
        mode: medium
        repeat: 3
        timeout_per_case: 420
    infermark:
      contexts: {short: 256, medium: 4096, long: 16384}
      requests: 5
      concurrency: [1, 2, 4]
      max_tokens: 256
      warmup: 1
      timeout: 420
    hermes_tasks:
      [harness-smoke-v1, convergence-smoke-v1, archiveguard-security-v1]
